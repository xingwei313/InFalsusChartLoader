name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: 构建 Release
        shell: cmd
        run: call build.bat Release

      - name: 构建 Debug
        shell: cmd
        run: call build.bat Debug

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader-Release
          path: bin/Release/InFalsusChartLoader.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader-Debug
          path: bin/Debug/InFalsusChartLoader.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InFalsusChartLoader-Release

      - uses: softprops/action-gh-release@v2
        with:
          files: InFalsusChartLoader.dll
          generate_release_notes: true
